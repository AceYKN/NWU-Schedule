name: nwu_schedule
description: A local-first timetable for Northwest University undergraduate students.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  crypto: ^3.0.6
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/calendars/nwu/source/
