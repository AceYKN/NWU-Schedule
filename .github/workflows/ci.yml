name: Flutter checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/validate_calendars.dart
      - run: dart run tool/validate_privacy.dart
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: node tool/test_nwu_dom_extractor.mjs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: >-
          dart run tool/validate_merged_manifest.dart
          build/app/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
      - if: github.ref == 'refs/heads/main'
        name: Create ephemeral release signing key
        run: >-
          keytool -genkeypair -v
          -keystore "$RUNNER_TEMP/nwu-ci-release.jks"
          -storepass ci-store-password
          -keypass ci-store-password
          -alias nwu-ci
          -keyalg RSA
          -keysize 2048
          -validity 1
          -dname "CN=NWU Schedule CI"
          -noprompt
      - if: github.ref == 'refs/heads/main'
        run: flutter build apk --release
        env:
          NWU_RELEASE_STORE_FILE: ${{ runner.temp }}/nwu-ci-release.jks
          NWU_RELEASE_STORE_PASSWORD: ci-store-password
          NWU_RELEASE_KEY_ALIAS: nwu-ci
          NWU_RELEASE_KEY_PASSWORD: ci-store-password
      - if: github.ref == 'refs/heads/main'
        run: >-
          dart run tool/validate_merged_manifest.dart
          build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          --release
      - if: github.ref == 'refs/heads/main'
        name: Upload review APKs
        uses: actions/upload-artifact@v4
        with:
          name: nwu-schedule-apks-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
